name: Docs

# Build the documentation site on every push to main and deploy it to GitHub Pages.
# The site is never committed — it is built fresh here and served from Pages.
# One-time setup: Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # every law this repository holds itself to lives in ./check.sh, so a
      # person at a desk and this runner ask for the same list. The mirror
      # runs in the `law` job beside this one, and skips here.
      - name: Every law but the grammar mirror
        run: python3 Checks/ci-check.py --skip law

      # Job logs need a signed-in reader; the toolchain and the first DocC
      # diagnostics are repeated as annotations, which the public API serves.
      - name: Generate the combined documentation site
        run: |
          xcodebuild -version | tr '\n' ' ' | sed 's/^/::notice::/'; echo
          set +e
          swift package \
            --allow-writing-to-directory "$GITHUB_WORKSPACE/_site" \
            generate-documentation \
            --enable-experimental-combined-documentation \
            --experimental-enable-custom-templates \
            --warnings-as-errors \
            --target VerificationIsIdentification --target Examples \
            --target GrammarLexicon --target Alphabet --target Notation \
            --target DocumentKit --target DocumentKitCertificates --target DocumentKitDemo \
            --transform-for-static-hosting \
            --hosting-base-path verification-is-identification \
            --output-path "$GITHUB_WORKSPACE/_site" 2>&1 | tee "$RUNNER_TEMP/docc.log"
          status=${PIPESTATUS[0]}
          set -e
          grep -E "(warning|error):" "$RUNNER_TEMP/docc.log" | head -10 | sed 's/^/::error::/' || true
          exit "$status"

      - name: One hook in every shell (the guard makes a second copy inert)
        run: |
          python3 - << 'EOF'
          import pathlib
          hook = pathlib.Path('Sources/VerificationIsIdentification/VerificationIsIdentification.docc/footer.html').read_text()
          root = pathlib.Path('_site')
          patched = 0
          for shell in root.rglob('index.html'):
              s = shell.read_text()
              if '__viInlineHook' in s or '</body>' not in s:
                  continue
              shell.write_text(s.replace('</body>', hook + '</body>'))
              patched += 1
          print('shells patched:', patched)
          EOF

      - name: Redirect the site root to the library documentation
        run: echo '<!DOCTYPE html><meta charset="utf-8"><title>Verification Is Identification</title><meta http-equiv="refresh" content="0; url=./documentation/verificationisidentification/"><a href="./documentation/verificationisidentification/">Documentation</a>' > "$GITHUB_WORKSPACE/_site/index.html"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  # THE LAW, JUDGED BESIDE THE SITE RATHER THAN AHEAD OF IT. Every discovered
  # source path gets one read-back carrier; emitted formations build. Source
  # byte coverage and reference bindings remain reader debt
  # (Contracts/Checks/grammar-reader-v1.md). It stays on every push,
  # because the one push it caught is the one that took the site down. What it
  # stops doing is holding the other steps up: nothing below it read its
  # result, so it never belonged in the same line of work. Run it locally
  # before pushing source: swift run Tools grammar
  law:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Distinct source carriers are read back and their emitted formations build
        run: python3 Checks/ci-check.py --only law

  deploy:
    needs: [build, law]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
