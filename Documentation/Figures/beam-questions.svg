<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="648" viewBox="0 0 1120 648" role="img" aria-labelledby="title desc">
<title id="title">One declared construction: a visible answer, an unknown source and a changing operation</title><desc id="desc">Three symbolic beams have coordinates (1,0,0), (1,0,1), (1,0,2). The supplied reading E keeps the first two coordinates. All three yield (1,0); the hidden coordinate is not determined. SwapVisible exchanges the first two and retains the third. Its visible result follows by swapping the retained pair. ExposeHidden instead puts the hidden coordinate first, producing distinct visible results from the same old image. This is a symbolic model with checked type relations, not a physical experiment.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Inter,'Segoe UI',Arial,sans-serif;fill:#18263b}.muted{fill:#526174}.blue{fill:#204f8f}.green{fill:#16634b}.amber{fill:#8b5e16}.math{font-family:'DejaVu Sans',sans-serif}.small{font-size:16px}.body{font-size:18px}.label{font-size:20px;font-weight:600}.heading{font-size:28px;font-weight:650}.eyebrow{font-size:14px;font-weight:700;letter-spacing:1.6px}</style>
<rect width="1120" height="1390" rx="16" fill="#ffffff"/>
<text x="40" y="42" class="eyebrow blue" >ONE CONSTRUCTION / FOUR STEPS</text><text x="40" y="83" class="heading" >Keep the question in view. Leave the source unknown.</text><text x="40" y="115" class="body muted" >The three-beam construction from the corpus. The actual source is one of these three, not selected.</text><rect x="40" y="143" width="1040" height="262" rx="12" fill="#f6f8fb" stroke="#dde3eb" stroke-width="1.5"/><text x="62" y="180" class="label" >1   A declared family and a supplied reading</text><text x="72" y="216" class="small muted" >source</text><text x="322" y="216" class="small muted" text-anchor="middle">α</text><text x="380" y="216" class="small muted" text-anchor="middle">β</text><text x="450" y="216" class="small muted" text-anchor="middle">hidden</text><rect x="298" y="228" width="110" height="125" rx="12" fill="#edf7f1" stroke="#bad9c8" stroke-width="1.5"/><rect x="420" y="228" width="60" height="125" rx="12" fill="#eef0f4" stroke="#ced5df" stroke-width="1.5"/><text x="72" y="258" class="small" >RedBeam</text><text x="322" y="258" class="label green" text-anchor="middle">1</text><text x="380" y="258" class="label green" text-anchor="middle">0</text><text x="450" y="258" class="label muted" text-anchor="middle">0</text><text x="72" y="295" class="small" >RedBeamWithIR</text><text x="322" y="295" class="label green" text-anchor="middle">1</text><text x="380" y="295" class="label green" text-anchor="middle">0</text><text x="450" y="295" class="label muted" text-anchor="middle">1</text><text x="72" y="332" class="small" >RedBeamWithMoreIR</text><text x="322" y="332" class="label green" text-anchor="middle">1</text><text x="380" y="332" class="label green" text-anchor="middle">0</text><text x="450" y="332" class="label muted" text-anchor="middle">2</text><path d="M500 289H642" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="571" y="254" class="small math blue" text-anchor="middle">E(α,β,r) = (α,β)</text><text x="571" y="279" class="small muted" text-anchor="middle">keeps two coordinates</text><rect x="664" y="229" width="388" height="123" rx="12" fill="#edf7f1" stroke="#bad9c8" stroke-width="1.5"/><text x="687" y="260" class="label green" >The same accessible record</text><text x="858" y="306" class="heading green" text-anchor="middle">(1, 0)</text><text x="62" y="383" class="small muted" >Scope: exactly these three declared sources. 0 = Never, 1 = Lit1, 2 = Lit2 in this symbolic model.</text><rect x="40" y="429" width="1040" height="210" rx="12" fill="#f6f8fb" stroke="#dde3eb" stroke-width="1.5"/><text x="62" y="465" class="label" >2   Keep the record. Change the question.</text><rect x="62" y="492" width="254" height="102" rx="12" fill="#ffffff" stroke="#dde3eb" stroke-width="1.5"/><text x="189" y="532" class="label" text-anchor="middle">Available: (1, 0)</text><text x="189" y="566" class="small muted" text-anchor="middle">All three sources still fit.</text><path d="M316 542H354V518H390" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M354 542V579H390" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="411" y="524" class="body" >What is the visible pair?</text><text x="411" y="585" class="body" >What is the hidden coordinate?</text><rect x="739" y="491" width="313" height="53" rx="12" fill="#edf7f1" stroke="#bad9c8" stroke-width="1.5"/><text x="760" y="524" class="label green" >(1, 0) — determined</text><rect x="739" y="552" width="313" height="53" rx="12" fill="#fff8ec" stroke="#e8d2aa" stroke-width="1.5"/><text x="760" y="585" class="label amber" >0, 1 or 2 — still open</text><rect x="40" y="663" width="1040" height="337" rx="12" fill="#f6f8fb" stroke="#dde3eb" stroke-width="1.5"/><text x="62" y="699" class="label" >3   A supplied transformation can use unknown contents</text><text x="62" y="730" class="body muted" >SwapVisible exchanges the visible coordinates and retains the hidden one.  r ∈ {0,1,2}.</text><rect x="62" y="755" width="310" height="70" rx="12" fill="#ffffff" stroke="#dde3eb" stroke-width="1.5"/><text x="217" y="798" class="label math" text-anchor="middle">xᵣ = (1, 0, r)</text><rect x="742" y="755" width="310" height="70" rx="12" fill="#ffffff" stroke="#dde3eb" stroke-width="1.5"/><text x="897" y="798" class="label math" text-anchor="middle">T(xᵣ) = (0, 1, r)</text><path d="M372 789H728" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="550" y="778" class="small blue" text-anchor="middle">same T for every r</text><path d="M217 825V870" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="230" y="853" class="body blue" >E</text><path d="M897 825V870" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="910" y="853" class="body blue" >E</text><rect x="62" y="883" width="310" height="62" rx="12" fill="#edf7f1" stroke="#bad9c8" stroke-width="1.5"/><text x="217" y="921" class="label green" text-anchor="middle">(1, 0)</text><rect x="742" y="883" width="310" height="62" rx="12" fill="#edf7f1" stroke="#bad9c8" stroke-width="1.5"/><text x="897" y="921" class="label green" text-anchor="middle">(0, 1)</text><path d="M372 914H728" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="550" y="884" class="small blue" text-anchor="middle">swap the retained pair</text><text x="550" y="908" class="small math" text-anchor="middle">E ∘ T = swap ∘ E</text><text x="62" y="975" class="small" >The full outputs differ in r. Their visible result follows from the old record without identifying r.</text><rect x="40" y="1024" width="1040" height="287" rx="12" fill="#f6f8fb" stroke="#dde3eb" stroke-width="1.5"/><text x="62" y="1060" class="label" >4   Change the operation. Check the relation again.</text><text x="62" y="1091" class="body muted" >ExposeHidden is a different supplied symbolic transformation: U(α,β,r) = (r,0,0).</text><rect x="62" y="1119" width="295" height="86" rx="12" fill="#ffffff" stroke="#dde3eb" stroke-width="1.5"/><text x="209" y="1153" class="label" text-anchor="middle">The old record stays (1, 0)</text><text x="209" y="1184" class="small muted" text-anchor="middle">The original reading remains true.</text><path d="M377 1162H658" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="518" y="1135" class="small math" text-anchor="middle">future question: E(U(xᵣ))</text><rect x="681" y="1119" width="371" height="86" rx="12" fill="#fff8ec" stroke="#e8d2aa" stroke-width="1.5"/><text x="703" y="1153" class="label amber" >(0, 0), (1, 0), or (2, 0)</text><text x="703" y="1184" class="small muted" >The same old record permits all three.</text><text x="62" y="1245" class="body" >No deterministic function of this old record alone can supply the new visible answer for all three.</text><text x="62" y="1281" class="small muted" >Another accessible distinction or an adequate different continuation must be supplied and justified.</text><text x="40" y="1344" class="small muted" >STATUS  The transformations and commuting law are supplied symbolic constructions checked by types.</text><text x="40" y="1373" class="small muted" >A physical operation, its calibration and its execution are not supplied by this picture or by the type check.</text></svg>
