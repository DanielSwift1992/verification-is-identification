  roleStyle.textContent = ROLE_CSS;
  (document.head || document.documentElement).appendChild(roleStyle);

  // The marker mechanism is explained above (DESIGN14 §1) — `notOurs` is its one piece of
  // bookkeeping: a fetched-and-rejected URL, cached so an SPA route change never re-fetches
  // something already known not to carry the marker.
  var notOurs = Object.create(null);

  function baseName(src) {
    // Strip DocC's own light/dark suffix (`x~dark.svg`) so either variant of the same asset is
    // recognised as the same name.
    return (src || "").split("/").pop().replace(/\.svg$/i, "").replace(/~dark$/, "");
  }

  function isSameOriginSvg(src) {
    if (!/\.svg(?:[?#]|$)/i.test(src || "")) { return false; }
    try {
      return new URL(src, window.location.href).origin === window.location.origin;
    } catch (e) {
      return false;
    }
  }

    var picture = img.closest("picture");
    var sources = picture ? picture.querySelectorAll("source[media][srcset]") : [];
    for (var i = 0; i < sources.length; i++) {
      if (window.matchMedia && window.matchMedia(sources[i].getAttribute("media")).matches) {
        return sources[i].getAttribute("srcset").split(",")[0].trim().split(/\s+/)[0];
      }
    }
    return img.currentSrc || img.getAttribute("src") || "";
  }

    if (img.dataset.vectorInlined) { return; }
    var src = resolvedSrc(img);
    if (notOurs[src]) { return; }
    img.dataset.vectorInlined = "pending";
    // `fetch` is async — between this call and its resolution, the raw `<img>` is still what
    // paints. That file's own `var(--vi-x, #lighthex)` fallbacks are the ONLY colours a plain
    // `<img>` ever sees (an image element has no access to the host document's CSS custom
    // properties), so in dark mode the untouched image is the LIGHT theme, briefly, regardless
    // of the page around it — a light flash at each of this image's own corners, most visible
    // where an image sits early in paint order. Hidden here, synchronously, before the fetch
    // starts; restored if the fetch fails OR the fetched document turns out not to carry our
    // own marker (some other same-origin SVG DocC itself references).

      .then(function (response) { return response.text(); })
      .then(function (text) {

          img.dataset.vectorInlined = "";
          img.style.visibility = "visible";
          return;

        // content column) rather than copying the `<img>`'s own width — DocC picks a fixed,
        // conservative default (300px) for a bare image regardless of the SVG's own aspect, far
        // too small for a wide canvas like the dashboard. Height follows the viewBox's own
        // aspect ratio (the canvas contract, Vector.swift) — nothing drifts.

        // ("/documentation/..."), and only the embedding page knows where the site's
        // root actually lives — GitHub Pages serves a project under its repository's
        // own prefix. Rewritten here, at inline time, the one moment both sides meet;
        // at a domain root the base is empty and nothing changes.

        if (docsBase) {

          for (var k = 0; k < anchors.length; k++) {
            var stated = anchors[k].getAttribute("href") || "";
            if (stated.indexOf("/documentation/") === 0) {
              anchors[k].setAttribute("href", docsBase + stated);
            }
          }
        }

        svg.setAttribute("data-vector-inlined", "true");
        var host = img.closest("picture") || img;
        host.replaceWith(svg);
      })
      .catch(function () {
        img.dataset.vectorInlined = "";
        img.style.visibility = "visible";
      });
  }

    var images = root.querySelectorAll ? root.querySelectorAll("img[src]") : [];
    for (var i = 0; i < images.length; i++) {
      var img = images[i];
      if (isSameOriginSvg(img.getAttribute("src"))) { inline(img); }
    }
  }

  // data JSON prefetched, so following any door is a cache hit. The state graph is known
  // and finite, so the "profile" a hot-path optimizer would gather at run time is read
  // off the page itself — both halves of a fork load while the reader decides.

    var anchors = root.querySelectorAll ? root.querySelectorAll("a[href]") : [];
    var budget = 12;
    for (var i = 0; i < anchors.length && budget > 0; i++) {
      var href = anchors[i].getAttribute("href") || "";
      if (href.indexOf(docsBase + "/documentation/") !== 0) { continue; }
      var page = href.split("#")[0].replace(/\/$/, "");
      var data = page.replace(docsBase + "/documentation/", docsBase + "/data/documentation/") + ".json";
      if (prefetched[data]) { continue; }
      prefetched[data] = true;

      link.rel = "prefetch";
      link.href = data;

  // every key. The state needs the real hash (CSS :target), so the navigation is allowed

    var anchor = event.target && event.target.closest ? event.target.closest("a") : null;
    if (!anchor) { return; }
    var href = anchor.getAttribute("href") || "";
    if (href.charAt(0) !== "#") { return; }
    if (!anchor.closest("svg[data-vi-canvas]")) { return; }

    var x = window.scrollX;
    var hold = function () { window.scrollTo(x, y); };

  }, true);

  // no navigation, nothing to scroll. Inert inside a plain <img>, like every enhancement here.

    var to = key.getAttribute("data-vi-to");

    for (var i = 0; i < variants.length; i++) {
      variants[i].style.display = variants[i].getAttribute("data-vi-at") === to ? "inline" : "none";

<script>
(function () {
  if (window.__viTableHook) { return; }
  window.__viTableHook = true;
  // Wide tables scroll inside their own box instead of pushing the page
  // sideways, and a header cell sorts its column on click, numbers as
  // numbers. The style goes through createElement because a plain <style>
  // in this template never reaches the live document (the note at the top
  // of this file), and the click listener sits on document, so a table
  // rendered by any later SPA navigation is covered without a rescan.
  // the hint that a header answers a click is on the header itself: every
  // sortable header wears a dim double arrow, the sorted one wears the
  // direction, and hover tints the cell. A cursor change alone is a hint
  // only the mouse sees.
  var css = document.createElement("style");
  css.textContent = ".content table, article table {display:block;overflow-x:auto;max-width:100%;}.content th, article th {cursor:pointer;white-space:nowrap;}.content th::after, article th::after {content:' \\2195';opacity:0.35;font-size:0.85em;}.content th:hover, article th:hover {background:var(--vi-role-SurfaceTrack);}.content th[data-vi-sort=down]::after, article th[data-vi-sort=down]::after {content:' \\2193';opacity:0.9;}.content th[data-vi-sort=up]::after, article th[data-vi-sort=up]::after {content:' \\2191';opacity:0.9;}";
  if (css.textContent === "null") { throw new Error("footer#layout: table style is missing"); }
  document.head.appendChild(css);
  function keyOf(row, index) {
    var cell = row.cells[index];
    var text = cell ? cell.textContent.trim() : "";
    var number = parseFloat(text.replace(/[^0-9.\-]/g, ""));
    return { number: isNaN(number) ? null : number, text: text.toLowerCase() };
  }
  document.addEventListener("click", function (event) {
    var head = event.target && event.target.closest && event.target.closest("th");
    if (!head) { return; }
    var table = head.closest("table");
    var body = table && table.tBodies[0];
    if (!body || body.rows.length < 2) { return; }
    var index = Array.prototype.indexOf.call(head.parentNode.cells, head);
    var descending = head.getAttribute("data-vi-sort") !== "down";
    head.setAttribute("data-vi-sort", descending ? "down" : "up");
    var rows = Array.prototype.slice.call(body.rows);
    rows.sort(function (a, b) {
      var left = keyOf(a, index), right = keyOf(b, index);
      var order = 0;
      if (left.number !== null && right.number !== null) { order = left.number - right.number; }
      else if (left.text < right.text) { order = -1; }
      else if (left.text > right.text) { order = 1; }
      return descending ? -order : order;
    });
    for (var i = 0; i < rows.length; i++) { body.appendChild(rows[i]); }
  });
})();
</script>
