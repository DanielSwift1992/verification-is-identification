<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1072" viewBox="0 758 1120 1072" role="img" aria-labelledby="title desc">
<title id="title">Two operations on the same three possible sources</title><desc id="desc">SwapVisible produces distinct full states with the same visible pair (0,1). Starting again from the original states, ExposeHidden gives visible pairs (0,0), (1,0), and (2,0). The old reading alone cannot determine this new answer. These are symbolic operations with checked type relations; physical execution is not established.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Inter,'Segoe UI',Arial,sans-serif;fill:#18263b}.muted{fill:#526174}.blue{fill:#204f8f}.green{fill:#16634b}.amber{fill:#8b5e16}.math{font-family:'DejaVu Sans',sans-serif}.small{font-size:16px}.body{font-size:18px}.label{font-size:20px;font-weight:600}.heading{font-size:28px;font-weight:650}.eyebrow{font-size:14px;font-weight:700;letter-spacing:1.6px}</style>
<rect width="1120" height="1830" rx="16" fill="#ffffff"/>
<style>
.body{font-size:24px}.small{font-size:22px}.label{font-size:26px;font-weight:600}
.heading{font-size:32px;font-weight:650}.title{font-size:40px;font-weight:650}
.tuple{font-family:'DejaVu Sans',sans-serif;font-size:32px}
.number{font-size:26px;font-weight:700;fill:#204f8f}
</style><text x="40" y="57" class="title" >One reading, three possible sources</text><text x="40" y="100" class="body" >The source is one of these three symbolic cases. All give the reading (1, 0).</text><text x="40" y="134" class="body" >We do not know which one is present.</text><rect x="40" y="166" width="1040" height="320" rx="12" fill="#f6f8fb" stroke="#dde3eb" stroke-width="1.5"/><text x="65" y="210" class="number" >1</text><text x="110" y="210" class="heading" >Three sources, one reading</text><text x="105" y="258" class="small muted" >Possible source states</text><text x="776" y="258" class="small muted" >Visible pair</text><text x="150" y="309" class="tuple muted" >(</text><text x="169" y="309" class="tuple green" >1</text><text x="191" y="309" class="tuple muted" >,</text><text x="211" y="309" class="tuple green" >0</text><text x="233" y="309" class="tuple muted" >,</text><text x="253" y="309" class="tuple muted" >0</text><text x="276" y="309" class="tuple muted" >)</text><path d="M320 299H390L506 355" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="150" y="365" class="tuple muted" >(</text><text x="169" y="365" class="tuple green" >1</text><text x="191" y="365" class="tuple muted" >,</text><text x="211" y="365" class="tuple green" >0</text><text x="233" y="365" class="tuple muted" >,</text><text x="253" y="365" class="tuple muted" >1</text><text x="276" y="365" class="tuple muted" >)</text><path d="M320 355H390L506 355" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="150" y="421" class="tuple muted" >(</text><text x="169" y="421" class="tuple green" >1</text><text x="191" y="421" class="tuple muted" >,</text><text x="211" y="421" class="tuple green" >0</text><text x="233" y="421" class="tuple muted" >,</text><text x="253" y="421" class="tuple muted" >2</text><text x="276" y="421" class="tuple muted" >)</text><path d="M320 411H390L506 355" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="476" y="294" class="small muted" >The reading keeps</text><text x="476" y="323" class="small muted" >two coordinates</text><path d="M518 355H734" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="526" y="394" class="small math blue" >E(α, β, r) = (α, β)</text><rect x="752" y="301" width="285" height="108" rx="12" fill="#edf7f1" stroke="#bad9c8" stroke-width="1.5"/><text x="894" y="368" class="title green" text-anchor="middle">(1, 0)</text><text x="65" y="458" class="body" >Only the third coordinate, r, differs. It is hidden from this reading.</text><rect x="40" y="510" width="1040" height="230" rx="12" fill="#f6f8fb" stroke="#dde3eb" stroke-width="1.5"/><text x="65" y="555" class="number" >2</text><text x="110" y="555" class="heading" >What can this reading answer?</text><text x="76" y="610" class="body" >What is the visible pair?</text><text x="76" y="688" class="body" >What is the hidden value?</text><rect x="540" y="579" width="497" height="59" rx="12" fill="#edf7f1" stroke="#bad9c8" stroke-width="1.5"/><text x="563" y="617" class="label green" >(1, 0) in every case</text><rect x="540" y="657" width="497" height="59" rx="12" fill="#fff8ec" stroke="#e8d2aa" stroke-width="1.5"/><text x="563" y="695" class="label amber" >Could be 0, 1, or 2</text><rect x="40" y="774" width="1040" height="454" rx="12" fill="#f6f8fb" stroke="#dde3eb" stroke-width="1.5"/><text x="65" y="820" class="number" >3</text><text x="110" y="820" class="heading" >One operation, the same visible result</text><text x="65" y="863" class="body" >SwapVisible exchanges the first two coordinates and keeps the hidden one.</text><text x="119" y="913" class="small muted" >Original state</text><text x="490" y="913" class="small muted" >After SwapVisible</text><text x="830" y="913" class="small muted" >Visible pair</text><text x="122" y="962" class="tuple muted" >(</text><text x="141" y="962" class="tuple green" >1</text><text x="163" y="962" class="tuple muted" >,</text><text x="183" y="962" class="tuple green" >0</text><text x="205" y="962" class="tuple muted" >,</text><text x="225" y="962" class="tuple muted" >0</text><text x="248" y="962" class="tuple muted" >)</text><path d="M298 952H445" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="494" y="962" class="tuple muted" >(</text><text x="513" y="962" class="tuple green" >0</text><text x="535" y="962" class="tuple muted" >,</text><text x="555" y="962" class="tuple green" >1</text><text x="577" y="962" class="tuple muted" >,</text><text x="597" y="962" class="tuple muted" >0</text><text x="620" y="962" class="tuple muted" >)</text><path d="M670 952H795" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="811" y="927" width="226" height="47" rx="12" fill="#edf7f1" stroke="#bad9c8" stroke-width="1.5"/><text x="924" y="962" class="tuple green" text-anchor="middle">(0, 1)</text><text x="122" y="1017" class="tuple muted" >(</text><text x="141" y="1017" class="tuple green" >1</text><text x="163" y="1017" class="tuple muted" >,</text><text x="183" y="1017" class="tuple green" >0</text><text x="205" y="1017" class="tuple muted" >,</text><text x="225" y="1017" class="tuple muted" >1</text><text x="248" y="1017" class="tuple muted" >)</text><path d="M298 1007H445" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="494" y="1017" class="tuple muted" >(</text><text x="513" y="1017" class="tuple green" >0</text><text x="535" y="1017" class="tuple muted" >,</text><text x="555" y="1017" class="tuple green" >1</text><text x="577" y="1017" class="tuple muted" >,</text><text x="597" y="1017" class="tuple muted" >1</text><text x="620" y="1017" class="tuple muted" >)</text><path d="M670 1007H795" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="811" y="982" width="226" height="47" rx="12" fill="#edf7f1" stroke="#bad9c8" stroke-width="1.5"/><text x="924" y="1017" class="tuple green" text-anchor="middle">(0, 1)</text><text x="122" y="1072" class="tuple muted" >(</text><text x="141" y="1072" class="tuple green" >1</text><text x="163" y="1072" class="tuple muted" >,</text><text x="183" y="1072" class="tuple green" >0</text><text x="205" y="1072" class="tuple muted" >,</text><text x="225" y="1072" class="tuple muted" >2</text><text x="248" y="1072" class="tuple muted" >)</text><path d="M298 1062H445" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="494" y="1072" class="tuple muted" >(</text><text x="513" y="1072" class="tuple green" >0</text><text x="535" y="1072" class="tuple muted" >,</text><text x="555" y="1072" class="tuple green" >1</text><text x="577" y="1072" class="tuple muted" >,</text><text x="597" y="1072" class="tuple muted" >2</text><text x="620" y="1072" class="tuple muted" >)</text><path d="M670 1062H795" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="811" y="1037" width="226" height="47" rx="12" fill="#edf7f1" stroke="#bad9c8" stroke-width="1.5"/><text x="924" y="1072" class="tuple green" text-anchor="middle">(0, 1)</text><text x="65" y="1131" class="body" >The full states still differ. The visible pair is (0, 1) in every case.</text><text x="65" y="1170" class="body" >The new reading follows by swapping the old pair: (1, 0) → (0, 1).</text><text x="65" y="1205" class="small math blue" >T(α, β, r) = (β, α, r)</text><text x="530" y="1205" class="small math blue" >E ∘ T = swap ∘ E</text><rect x="40" y="1252" width="1040" height="454" rx="12" fill="#f6f8fb" stroke="#dde3eb" stroke-width="1.5"/><text x="65" y="1298" class="number" >4</text><text x="110" y="1298" class="heading" >A different operation makes the hidden value matter</text><text x="65" y="1341" class="body" >From the same original states, ExposeHidden puts r in the visible pair.</text><text x="119" y="1391" class="small muted" >Original state</text><text x="480" y="1391" class="small muted" >After ExposeHidden</text><text x="830" y="1391" class="small muted" >Visible pair</text><text x="122" y="1440" class="tuple muted" >(</text><text x="141" y="1440" class="tuple green" >1</text><text x="163" y="1440" class="tuple muted" >,</text><text x="183" y="1440" class="tuple green" >0</text><text x="205" y="1440" class="tuple muted" >,</text><text x="225" y="1440" class="tuple muted" >0</text><text x="248" y="1440" class="tuple muted" >)</text><path d="M298 1430H445" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="494" y="1440" class="tuple muted" >(</text><text x="513" y="1440" class="tuple amber" >0</text><text x="535" y="1440" class="tuple muted" >,</text><text x="555" y="1440" class="tuple amber" >0</text><text x="577" y="1440" class="tuple muted" >,</text><text x="597" y="1440" class="tuple muted" >0</text><text x="620" y="1440" class="tuple muted" >)</text><path d="M670 1430H795" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="811" y="1405" width="226" height="47" rx="12" fill="#fff8ec" stroke="#e8d2aa" stroke-width="1.5"/><text x="924" y="1440" class="tuple amber" text-anchor="middle">(0, 0)</text><text x="122" y="1495" class="tuple muted" >(</text><text x="141" y="1495" class="tuple green" >1</text><text x="163" y="1495" class="tuple muted" >,</text><text x="183" y="1495" class="tuple green" >0</text><text x="205" y="1495" class="tuple muted" >,</text><text x="225" y="1495" class="tuple muted" >1</text><text x="248" y="1495" class="tuple muted" >)</text><path d="M298 1485H445" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="494" y="1495" class="tuple muted" >(</text><text x="513" y="1495" class="tuple amber" >1</text><text x="535" y="1495" class="tuple muted" >,</text><text x="555" y="1495" class="tuple amber" >0</text><text x="577" y="1495" class="tuple muted" >,</text><text x="597" y="1495" class="tuple muted" >0</text><text x="620" y="1495" class="tuple muted" >)</text><path d="M670 1485H795" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="811" y="1460" width="226" height="47" rx="12" fill="#fff8ec" stroke="#e8d2aa" stroke-width="1.5"/><text x="924" y="1495" class="tuple amber" text-anchor="middle">(1, 0)</text><text x="122" y="1550" class="tuple muted" >(</text><text x="141" y="1550" class="tuple green" >1</text><text x="163" y="1550" class="tuple muted" >,</text><text x="183" y="1550" class="tuple green" >0</text><text x="205" y="1550" class="tuple muted" >,</text><text x="225" y="1550" class="tuple muted" >2</text><text x="248" y="1550" class="tuple muted" >)</text><path d="M298 1540H445" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="494" y="1550" class="tuple muted" >(</text><text x="513" y="1550" class="tuple amber" >2</text><text x="535" y="1550" class="tuple muted" >,</text><text x="555" y="1550" class="tuple amber" >0</text><text x="577" y="1550" class="tuple muted" >,</text><text x="597" y="1550" class="tuple muted" >0</text><text x="620" y="1550" class="tuple muted" >)</text><path d="M670 1540H795" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="811" y="1515" width="226" height="47" rx="12" fill="#fff8ec" stroke="#e8d2aa" stroke-width="1.5"/><text x="924" y="1550" class="tuple amber" text-anchor="middle">(2, 0)</text><text x="65" y="1608" class="body" >The old reading (1, 0) alone cannot tell us which new pair results.</text><text x="65" y="1646" class="body" >For this new answer, we need an observation that distinguishes these cases.</text><text x="65" y="1682" class="small math blue" >U(α, β, r) = (r, 0, 0)</text><text x="40" y="1751" class="small muted" >These relations are checked in a symbolic model. The diagram does not establish</text><text x="40" y="1783" class="small muted" >that the operations can be performed on a physical source.</text></svg>
