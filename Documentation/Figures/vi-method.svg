<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1000" viewBox="0 0 1120 1000" role="img" aria-labelledby="title desc">
<title id="title">VI: a determined answer and an adequate continuation</title><desc id="desc">The first panel states VI U2c: a nonempty compatible family determines an answer exactly when the question is constant on it. The second states the adequacy law from Acquisition Keeps Its Question: intersect the available adequate continuations across all source-residue pairs compatible with the complete input. A chosen continuation and its realization must still be supplied. These are criteria, not a claim of automatic construction.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Inter,'Segoe UI',Arial,sans-serif;fill:#18263b}.muted{fill:#526174}.blue{fill:#204f8f}.green{fill:#16634b}.amber{fill:#8b5e16}.math{font-family:'DejaVu Sans',sans-serif}.small{font-size:16px}.body{font-size:18px}.label{font-size:20px;font-weight:600}.heading{font-size:28px;font-weight:650}.eyebrow{font-size:14px;font-weight:700;letter-spacing:1.6px}</style>
<rect width="1120" height="1000" rx="16" fill="#ffffff"/>
<text x="40" y="42" class="eyebrow blue" >VERIFICATION IS IDENTIFICATION</text><text x="40" y="83" class="heading" >What do the available relations determine?</text><text x="40" y="115" class="body muted" >The question fixes what must agree. The rest can remain unknown.</text><rect x="40" y="150" width="1040" height="300" rx="12" fill="#f6f8fb" stroke="#dde3eb" stroke-width="1.5"/><text x="62" y="184" class="label" >1   Establish an answer</text><text x="1048" y="184" class="small muted" text-anchor="end">VI · U2c</text><rect x="62" y="211" width="254" height="155" rx="12" fill="#ffffff" stroke="#dde3eb" stroke-width="1.5"/><text x="80" y="243" class="label" >Compatible cases</text><text x="80" y="279" class="body math blue" >S = {s ∈ F : C(s)}</text><text x="80" y="310" class="small muted" >F: admitted candidates</text><text x="80" y="334" class="small muted" >C: supplied constraints</text><path d="M316 287H367" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="341" y="268" class="small muted" text-anchor="middle">ask</text><rect x="380" y="243" width="176" height="90" rx="12" fill="#edf3fb" stroke="#bdcfe7" stroke-width="1.5"/><text x="468" y="278" class="label blue" text-anchor="middle">Question q</text><text x="468" y="308" class="body math" text-anchor="middle">q : F → A</text><path d="M556 287H595V240H627" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M556 287H627" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><path d="M595 287V345H627" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="640" y="209" width="412" height="63" rx="12" fill="#edf7f1" stroke="#bad9c8" stroke-width="1.5"/><text x="659" y="235" class="label green" >One answer</text><text x="659" y="257" class="body math" >S ≠ ∅ and q(S) = {a}</text><rect x="640" y="279" width="412" height="52" rx="12" fill="#ffffff" stroke="#dde3eb" stroke-width="1.5"/><text x="659" y="311" class="body" >Several answers: q varies on S</text><rect x="640" y="338" width="412" height="52" rx="12" fill="#fff8ec" stroke="#e8d2aa" stroke-width="1.5"/><text x="659" y="370" class="body amber" >No compatible case: S = ∅</text><text x="62" y="407" class="body" >One answer can be established while several source candidates remain.</text><text x="62" y="433" class="small muted" >“Not yet established” is a state of the check, separate from these three mathematical cases.</text><rect x="40" y="480" width="1040" height="360" rx="12" fill="#f6f8fb" stroke="#dde3eb" stroke-width="1.5"/><text x="62" y="514" class="label" >2   Choose a continuation</text><text x="1048" y="514" class="small muted" text-anchor="end">Acquisition Keeps Its Question · The law</text><rect x="62" y="541" width="284" height="190" rx="12" fill="#ffffff" stroke="#dde3eb" stroke-width="1.5"/><text x="80" y="573" class="label" >Source and reached state</text><text x="80" y="606" class="small math blue" >F ⊆ X × Y, actual relation</text><text x="80" y="635" class="small muted" >x: initial condition</text><text x="80" y="658" class="small muted" >y: reached state</text><text x="80" y="681" class="small muted" >m = E(y): complete input</text><text x="80" y="704" class="small muted" >to the choice of continuation</text><path d="M346 638H383" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="396" y="541" width="306" height="190" rx="12" fill="#edf3fb" stroke="#bdcfe7" stroke-width="1.5"/><text x="414" y="573" class="label blue" >What works throughout</text><text x="414" y="608" class="small math" >S(m) = {(x,y) ∈ F : E(y)=m}</text><text x="414" y="636" class="body math" >W(m) = ⋂ W(x,y)</text><text x="414" y="659" class="small muted" >over all (x,y) in S(m)</text><text x="414" y="682" class="small muted" >W(x,y): available continuations</text><text x="414" y="702" class="small muted" >that meet the original requirement</text><text x="414" y="722" class="small muted" >at this actual source–residue pair.</text><path d="M702 638H739" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6 5"/><rect x="752" y="541" width="300" height="190" rx="12" fill="#edf7f1" stroke="#bad9c8" stroke-width="1.5"/><text x="770" y="573" class="label green" >Supply and carry it out</text><text x="770" y="604" class="body math" >If W(m) ≠ ∅:</text><text x="770" y="632" class="body math" >supply d(m) ∈ W(m)</text><text x="770" y="659" class="small" >Provide its laws and access.</text><text x="770" y="679" class="small" >Realize the chosen continuation.</text><text x="770" y="699" class="small" >If required, every admitted</text><text x="770" y="719" class="small" >execution must complete.</text><text x="62" y="770" class="body" >The same chosen program can act on different unknown contents and produce different results.</text><text x="62" y="797" class="small muted" >For reached m. F covers all admitted outcomes, with an outcome for each admitted initial condition.</text><text x="62" y="824" class="small muted" >A nonempty intersection establishes existence. It does not supply a choice or an executor.</text><path d="M902 731V868H560V887" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="904" y="862" class="small muted" text-anchor="end">record the actual result</text><rect x="40" y="887" width="1040" height="72" rx="12" fill="#ffffff" stroke="#a6b5c8" stroke-width="1.5"/><text x="62" y="916" class="label" >For the next participant</text><text x="62" y="944" class="body muted" >Keep the original requirement, actual residue, available access and grounds of the next use.</text><text x="40" y="985" class="small muted" >The diagrams state the criteria. Their premises, action laws and source connections require grounds.</text></svg>
