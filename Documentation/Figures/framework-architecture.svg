<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="890" viewBox="0 0 1120 890" role="img" aria-labelledby="title desc">
<title id="title">VI framework: target responsibilities and present implementation</title><desc id="desc">Target design: VI owns the research, constructions and where/count semantics. Showcase owns the worked organization, rendering and organizational policy. Gate supplies interfaces and a judge implementation. A versioned contract links the semantic owner to an implementation. The package split and gate alignment are not complete. Desk is a research workspace. Arrow labels distinguish source dependencies from conformance and delivery.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#64748b"/></marker></defs>
<style>text{font-family:Inter,'Segoe UI',Arial,sans-serif;fill:#18263b}.muted{fill:#526174}.blue{fill:#204f8f}.green{fill:#16634b}.amber{fill:#8b5e16}.math{font-family:'DejaVu Sans',sans-serif}.small{font-size:16px}.body{font-size:18px}.label{font-size:20px;font-weight:600}.heading{font-size:28px;font-weight:650}.eyebrow{font-size:14px;font-weight:700;letter-spacing:1.6px}</style>
<rect width="1120" height="890" rx="16" fill="#ffffff"/>
<text x="40" y="42" class="eyebrow blue" >FRAMEWORK / TARGET RESPONSIBILITIES</text><text x="40" y="83" class="heading" >Three packages. Each pass has a semantic owner.</text><text x="40" y="115" class="body muted" >Dashed boundaries show the intended split. The present code has not yet been moved.</text><rect x="40" y="149" width="1040" height="83" rx="12" fill="#f6f8fb" stroke="#dde3eb" stroke-width="1.5"/><text x="62" y="180" class="label" >People and agents</text><text x="62" y="209" class="body muted" >Bring a question, a record and access to work. Desk currently holds the research process.</text><path d="M905 232V290" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="919" y="266" class="small muted" >submit a record</text><rect x="40" y="302" width="300" height="326" rx="12" fill="#edf3fb" stroke="#7c9fc9" stroke-width="1.5" stroke-dasharray="7 5"/><text x="62" y="339" class="heading blue" >vi</text><text x="62" y="376" class="body" >Research and constructions</text><text x="62" y="405" class="body" >Papers · relations · examples</text><text x="62" y="434" class="body" >Checks of stated consequences</text><rect x="60" y="478" width="260" height="125" rx="12" fill="#ffffff" stroke="#bdcfe7" stroke-width="1.5"/><text x="78" y="509" class="label blue" >Semantic owner</text><text x="78" y="540" class="small" >where: declared type relations</text><text x="78" y="565" class="small" >count: selected count question</text><text x="78" y="590" class="small" >Canon + conformance fixtures</text><rect x="410" y="302" width="300" height="326" rx="12" fill="#f7f8fa" stroke="#98a5b7" stroke-width="1.5" stroke-dasharray="7 5"/><text x="432" y="339" class="heading" >showcase</text><text x="432" y="376" class="body" >A constructed world</text><text x="432" y="405" class="body" >Organization · DocumentKit</text><text x="432" y="434" class="body" >Pages · SVG · site generation</text><rect x="430" y="478" width="260" height="125" rx="12" fill="#ffffff" stroke="#dde3eb" stroke-width="1.5"/><text x="448" y="509" class="label" >Its own obligations</text><text x="448" y="540" class="small" >Organization policy + judge</text><text x="448" y="565" class="small" >Artifacts match constructions</text><text x="448" y="590" class="small" >Publication controls retain scope</text><rect x="780" y="302" width="300" height="326" rx="12" fill="#edf7f1" stroke="#7aa68f" stroke-width="1.5" stroke-dasharray="7 5"/><text x="802" y="339" class="heading green" >gate</text><text x="802" y="376" class="body" >Entry and delivery</text><text x="802" y="405" class="body" >Records from other projects</text><text x="802" y="434" class="body" >Calls checks · returns results</text><rect x="800" y="478" width="260" height="125" rx="12" fill="#ffffff" stroke="#bad9c8" stroke-width="1.5"/><text x="818" y="509" class="label green" >Supplied implementation</text><text x="818" y="540" class="small" >Must pass the selected contract</text><text x="818" y="565" class="small" >Carries question + coverage</text><text x="818" y="590" class="small" >A port preserves the question</text><path d="M410 442H340" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="375" y="424" class="small muted" text-anchor="middle">uses vi</text><path d="M190 628V684" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="205" y="663" class="small muted" >defines where / count</text><path d="M560 628V684" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="575" y="663" class="small muted" >defines organization</text><rect x="40" y="698" width="1040" height="99" rx="12" fill="#ffffff" stroke="#8ba2be" stroke-width="1.5"/><text x="62" y="730" class="label blue" >Contract of the selected pass</text><text x="62" y="758" class="body" >Question / semantics     ·     accepted input     ·     response form     ·     conformance suite</text><text x="62" y="783" class="small muted" >Versions belong to each pass. Passing finite fixtures establishes that scope of conformance.</text><path d="M930 628V684" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arrow)"/><text x="945" y="663" class="small muted" >conforms to</text><text x="40" y="829" class="body" >CURRENT  Court and showcase targets share the vi repository. Gate still pins an older canon.</text><text x="40" y="856" class="small muted" >NEXT  Align contracts and coverage, measure check profiles, then move the showcase and its controls.</text><text x="40" y="880" class="small muted" >The publication checks depend on DocumentKit today; this is a test dependency, not a core-library import.</text></svg>
