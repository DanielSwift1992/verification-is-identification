name: Declared Swift toolchain
description: Install the Swift.org release named by .swift-version without changing xcode-select
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        package="$RUNNER_TEMP/swiftly.pkg"
        curl --fail --location --silent --show-error \
          https://download.swift.org/swiftly/darwin/swiftly-1.1.2.pkg -o "$package"
        pkgutil --check-signature "$package"
        installer -pkg "$package" -target CurrentUserHomeDirectory
        rm "$package"
        manager="$HOME/.swiftly/bin/swiftly"
        "$manager" init --skip-install --no-modify-profile --assume-yes
        "$manager" install "$(cat .swift-version)" --assume-yes
        # run exposes the actual toolchain, rather than its proxies.
        # TOOLCHAINS makes xcrun (also used by verdict receipts) agree with PATH.
        swift_bin=$("$manager" run /usr/bin/which swiftc)
        toolchain=$(dirname "$(dirname "$(dirname "$swift_bin")")")
        identifier=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$toolchain/Info.plist")
        dirname "$swift_bin" >> "$GITHUB_PATH"
        echo "TOOLCHAINS=$identifier" >> "$GITHUB_ENV"
        echo "SDKROOT=$(xcrun --show-sdk-path)" >> "$GITHUB_ENV"
